[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-harness"
version = "0.1.0"
description = "Agent harness with tool use and computer use for local LLMs (LM Studio, Ollama, llama.cpp)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
computer = ["pyautogui>=0.9.54", "pillow>=10", "mss>=9", "pyperclip>=1.8"]
dev = ["pytest>=8"]

[project.scripts]
local-agent = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]
